[project]
name = "pacman"
version = "0.1.0"
description = "Pac-Man clone built for the 42 curriculum."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "jbarthel" },
    { name = "qrios" },
]
dependencies = [
    "pygame>=2.5",
    "mazegen",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "flake8-docstrings>=1.7",
    "mypy>=1.10",
    "black>=24.0",
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.uv.sources]
mazegen = { path = "mazegen-0.2.0-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
exclude = [".venv/"]

[[tool.mypy.overrides]]
module = "mazegen"
ignore_missing_imports = true
follow_imports = "skip"

[tool.black]
line-length = 79
target-version = ["py310"]
exclude = '''
/(
    \.venv
  | mazegenerator-00001-py3-none-any
  | build
  | dist
)/
'''
